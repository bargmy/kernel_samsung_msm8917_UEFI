name: Build and release J250F images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j250f-release-${{ github.ref }}-${{ github.run_number }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Choose a separate release for this version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="j250f-build-${GITHUB_RUN_NUMBER}"
          fi
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || exit 1
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [DEBUG, RELEASE]
    env:
      BUILD_MODE: ${{ matrix.mode }}
      BUILD_VERSION: ${{ needs.version.outputs.tag }}
      CLANG38_BIN: /usr/lib/llvm-18/bin/
      CLANG38_ARM_PREFIX: arm-linux-gnueabihf-
      GCC5_ARM_PREFIX: arm-linux-gnueabihf-
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pip-requirements.txt
      - name: Install ARM32 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev acpica-tools nasm \
            gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu clang-18 llvm-18 \
            llvm-18-dev lld-18 libssl-dev mono-devel
          python -m pip install -r pip-requirements.txt
      - name: Build and validate image
        shell: bash
        run: bash scripts/ci/build-j250f.sh "$BUILD_MODE" "$BUILD_VERSION"
      - name: Save versioned image
        uses: actions/upload-artifact@v4
        with:
          name: j250f-image-${{ matrix.mode }}
          path: dist/*
          if-no-files-found: error
      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j250f-${{ matrix.mode }}-logs
          path: |
            j250f-build.log
            Build/BUILDLOG_J250FPkg.txt
            Build/J250FPkg-ARM/${{ matrix.mode }}_CLANG38/BUILD_REPORT.TXT
          if-no-files-found: ignore

  release:
    # Run after the build matrix finishes, even if RELEASE fails. The DEBUG
    # artifact is required; PRs never publish releases.
    if: ${{ always() && github.event_name != 'pull_request' && needs.version.result == 'success' }}
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: j250f-image-*
          merge-multiple: true
          path: artifacts
      - name: Publish DEBUG (and RELEASE when available)
        shell: bash
        run: |
          set -euo pipefail
          debug="artifacts/Mu-J250F-${RELEASE_TAG}-DEBUG.img"
          release="artifacts/Mu-J250F-${RELEASE_TAG}-RELEASE.img"
          # A failed RELEASE matrix entry does not prevent publication of a
          # successfully validated DEBUG image uploaded by its matrix entry.
          test -s "$debug" || { echo "::error::No successful DEBUG artifact; nothing to release"; exit 1; }
          test -s "$debug.sha256" || { echo "::error::DEBUG checksum missing"; exit 1; }
          (cd artifacts && sha256sum -c "Mu-J250F-${RELEASE_TAG}-DEBUG.img.sha256")
          assets=("$debug" "$debug.sha256")
          title="J250F ${RELEASE_TAG} — DEBUG only"
          build_status="DEBUG build succeeded; RELEASE image was not produced."

          # Only include RELEASE if its own build completed and its hash matches.
          # Never publish a missing, partial, or unverified RELEASE image.
          if [[ -e "$release" || -e "$release.sha256" ]]; then
            test -s "$release" || { echo "::error::Incomplete RELEASE artifact"; exit 1; }
            test -s "$release.sha256" || { echo "::error::Incomplete RELEASE checksum"; exit 1; }
            (cd artifacts && sha256sum -c "Mu-J250F-${RELEASE_TAG}-RELEASE.img.sha256")
            assets+=("$release" "$release.sha256")
            title="J250F ${RELEASE_TAG} — DEBUG and RELEASE"
            build_status="Both DEBUG and RELEASE builds succeeded."
          fi

          cat > notes.md <<EOF
          Samsung SM-J250F / j2y18lte Project Mu ARM32 UEFI firmware.

          Commit: ${GITHUB_SHA}
          Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ${build_status}
          DEBUG includes diagnostics and permits unsigned RAM EFI loads without a device path.
          RELEASE (if attached) retains normal image verification.
          Both variants retain read-only eMMC access and CRC checks.
          Successful compilation does not establish physical hardware operation.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Reruns may update assets only for the same commit.
            existing=$(gh release view "$RELEASE_TAG" --json body --jq .body)
            [[ "$existing" == *"Commit: ${GITHUB_SHA}"* ]] || exit 1
            # Preserve a previously complete release on a partial rerun.
            if [[ "${#assets[@]}" -gt 2 || "$existing" != *"Both DEBUG and RELEASE builds succeeded."* ]]; then
              gh release edit "$RELEASE_TAG" --title "$title" --notes-file notes.md
            fi
          else
            args=()
            if [[ "$GITHUB_REF_TYPE" != tag ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "$title" --notes-file notes.md "${args[@]}"
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
